<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Autofillr test form — nested frame</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="frame">
    <div class="row">
      <label for="shipping-given-name"><code>shipping given-name</code></label>
      <input id="shipping-given-name" type="text" autocomplete="shipping given-name" />
    </div>
    <div class="row">
      <label for="shipping-tel"><code>shipping tel</code></label>
      <input id="shipping-tel" type="text" autocomplete="shipping tel" />
    </div>
  </body>
</html>
